# Configuration minimale de la CLI Supabase (développement local / db push).
# Les réglages du projet hébergé se font dans le dashboard Supabase (voir README).
project_id = "bingobuzz"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# connexion obligatoire : pas de compte invité
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# inscription e-mail + mot de passe : l'adresse doit être confirmée
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme ton compte BingoBuzz"
